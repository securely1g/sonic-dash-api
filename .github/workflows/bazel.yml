name: Bazel

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Bazel (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            architecture: amd64
            machine: x86_64
            runner: ubuntu-24.04
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
            bazel_args: ""
            bazel_config: default
          - arch: ARM64
            architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
            bazel_args: --config=aarch64
            bazel_config: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      # This immutable multiarchitecture manifest selects the native image.
      image: debian:trixie-20260713@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4
      options: --init
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_IMAGE: debian:trixie-20260713@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4
    steps:
      - name: Install build and package inspection tools
        run: |
          # Match the pinned sonic-build-infra APT snapshots. HTTP bootstraps
          # ca-certificates; APT still verifies Debian's signed Release files.
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/20260727T143429Z/
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/20260726T121236Z/
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl gdb git python3 tar xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native Trixie environment
        run: |
          source /etc/os-release
          test "$ID" = debian
          test "$VERSION_CODENAME" = trixie
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(dpkg --print-architecture)" = '${{ matrix.architecture }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p artifacts/validation
          cp /etc/os-release artifacts/validation/os-release
          cp /etc/apt/sources.list.d/debian.sources artifacts/validation/apt-sources.sources
          apt-cache policy > artifacts/validation/apt-policy.txt
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > artifacts/validation/host-packages.txt

      - name: Verify the checkout has no committed dependency lock
        run: |
          test ! -e MODULE.bazel.lock
          test -z "$(git ls-files -- MODULE.bazel.lock)"
          git check-ignore --quiet --no-index MODULE.bazel.lock

      - name: Install pinned Bazel
        run: |
          test "$(cat .bazelversion)" = 8.5.1
          curl --fail --location --retry 3 --output /tmp/bazel \
            'https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${{ matrix.bazel_arch }}'
          printf '%s  %s\n' '${{ matrix.bazel_sha }}' /tmp/bazel | sha256sum --check --strict
          install -m 0755 /tmp/bazel /usr/local/bin/bazel

      - name: Check Bazel formatting
        run: >-
          bazel run ${{ matrix.bazel_args }} --lockfile_mode=update
          @buildifier_prebuilt//:buildifier -- -mode=check -r "$GITHUB_WORKSPACE"

      - name: Build DASH from source and package its runtime and symbols
        run: >-
          bazel build ${{ matrix.bazel_args }} --jobs=4 --lockfile_mode=update
          --build_event_json_file="$GITHUB_WORKSPACE/artifacts/validation/build-events.json"
          //:libdashapi_deb //:libdashapi_dbg_deb //bazel:runtime_consumer_test

      - name: Run C++, Python, runtime and package tests
        run: >-
          bazel test ${{ matrix.bazel_args }} --jobs=4 --lockfile_mode=update
          --nocache_test_results --test_output=errors
          --build_event_json_file="$GITHUB_WORKSPACE/artifacts/validation/test-events.json"
          //bazel:source_contract_test //bazel:runtime_consumer_test
          //bazel:utils_test //bazel:python_test

      - name: Test installed packages with their declared runtime dependencies
        run: |
          apt-get install -y --no-install-recommends \
            ./bazel-bin/libdashapi_1.0.0_${{ matrix.architecture }}.deb \
            ./bazel-bin/libdashapi-dbg_1.0.0_${{ matrix.architecture }}.deb
          env -u LD_LIBRARY_PATH -u PYTHONPATH \
            python3 bazel/installed_package_test.py \
            2>&1 | tee artifacts/validation/installed-package-test.log
          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
            > artifacts/validation/installed-packages.txt
          apt-cache policy libprotobuf32t64 python3-protobuf \
            > artifacts/validation/installed-runtime-policy.txt

      - name: Record source generation and compilation actions
        run: >-
          bazel aquery ${{ matrix.bazel_args }} --lockfile_mode=update
          'mnemonic("CppCompile|DebianProtoSources|SwigGen.*", deps(//:libdashapi_deb))'
          --output=jsonproto > artifacts/validation/source-actions.json

      - name: Collect source-built packages and provenance
        run: >-
          python3 bazel/ci/collect_artifacts.py
          --architecture '${{ matrix.architecture }}'
          --bazel-config '${{ matrix.bazel_config }}'
          --image "$CI_IMAGE" --output-dir artifacts

      - name: Verify generated dependency resolution leaves tracked files clean
        run: |
          test -s MODULE.bazel.lock
          git check-ignore --quiet MODULE.bazel.lock
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-dash-api-validation-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/validation/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload runtime and matching debug packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-dash-api-packages-${{ matrix.arch }}-${{ github.sha }}
          path: |
            artifacts/packages/
            artifacts/development/
            artifacts/consumer/
            artifacts/provenance.json
          if-no-files-found: error
