name: Bazel

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Bazel (${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            architecture: amd64
            machine: x86_64
            runner: ubuntu-24.04
            bazel_arch: x86_64
            bazel_sha: 61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e
            bazel_args: ""
            bazel_config: default
          - arch: ARM64
            architecture: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            bazel_arch: arm64
            bazel_sha: b7f2a85595e8a87d54843bc656c1e379fd9b8c1b5f783dc41717c1d7eb7cc49f
            bazel_args: --config=aarch64
            bazel_config: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      # This immutable multiarchitecture manifest selects the native image.
      image: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
      options: --init
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CI_IMAGE: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    steps:
      - name: Install build and package inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git python3 tar xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native Trixie environment
        run: |
          source /etc/os-release
          test "$ID" = debian
          test "$VERSION_CODENAME" = trixie
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(dpkg --print-architecture)" = '${{ matrix.architecture }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p artifacts/validation
          cp /etc/os-release artifacts/validation/os-release
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > artifacts/validation/host-packages.txt

      - name: Install pinned Bazel
        run: |
          test "$(cat .bazelversion)" = 8.5.1
          curl --fail --location --retry 3 --output /tmp/bazel \
            'https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-${{ matrix.bazel_arch }}'
          printf '%s  %s\n' '${{ matrix.bazel_sha }}' /tmp/bazel | sha256sum --check --strict
          install -m 0755 /tmp/bazel /usr/local/bin/bazel

      - name: Check Bazel formatting
        run: >-
          bazel run ${{ matrix.bazel_args }} --lockfile_mode=error
          @buildifier_prebuilt//:buildifier -- -mode=check -r "$GITHUB_WORKSPACE"

      - name: Build the import, runtime package and native consumer
        run: >-
          bazel build ${{ matrix.bazel_args }} --jobs=4 --lockfile_mode=error
          --build_event_json_file="$GITHUB_WORKSPACE/artifacts/validation/build-events.json"
          //:prebuilt_files //:libdashapi_pkg //bazel:runtime_consumer_test

      - name: Run import and runtime tests
        run: >-
          bazel test ${{ matrix.bazel_args }} --jobs=4 --lockfile_mode=error
          --nocache_test_results --test_output=errors
          --build_event_json_file="$GITHUB_WORKSPACE/artifacts/validation/test-events.json"
          //bazel:prebuilt_contract_test //bazel:runtime_consumer_test

      - name: Collect validated inputs and provenance
        run: >-
          python3 bazel/ci/collect_artifacts.py
          --architecture '${{ matrix.architecture }}'
          --bazel-config '${{ matrix.bazel_config }}'
          --image "$CI_IMAGE" --output-dir artifacts

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-dash-api-validation-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/validation/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload validated import and consumer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-dash-api-import-${{ matrix.arch }}-${{ github.sha }}
          path: |
            artifacts/import/
            artifacts/consumer/
            artifacts/runtime/
            artifacts/provenance.json
          if-no-files-found: error
